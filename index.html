<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        

        }
        #el1:hover~img{
            transform:translateX(300px);
            transition:all 3s linear 1s;
        }
        #el2:hover~img{
            transform:scale(1.5);
            transition:all 3s linear 1s;
        }
        #el3:hover~img{
            transform:rotate(180deg);
            transition:all 3s linear 1s;
        }
        #el4:hover~img{
            transform:skew(-20deg);
            transition:all 3s linear 1s;
        }
        
}

    </style>
    
</head>
<body>
    <center>
    <button id="el1">translate</button>
    <button id="el2">scale</button>
    <button id="el3">rotate</button>
    <button id="el4">skew</button>
    <img src="dog.jpg" alt="">
</center>
</body>
</html>
